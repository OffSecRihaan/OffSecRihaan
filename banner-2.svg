<svg width="1200" height="260" viewBox="0 0 1200 260">

  <!-- Background -->
  <rect width="1200" height="260" fill="#080808"/>

  <!-- Minimal top line -->
  <rect x="80" y="70" width="1040" height="1" fill="#202020"/>

  <!-- Main title -->
  <text
    x="600"
    y="145"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="6"
    fill="#f2f2f2">
    BUG BOUNTY HUNTER
  </text>

  <!-- Extremely subtle cyan separation -->
  <text
    x="598"
    y="145"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="6"
    fill="#00d9ff"
    opacity="0">

    BUG BOUNTY HUNTER

    <animate
      attributeName="opacity"
      values="0;0;0.18;0;0;0"
      dur="5s"
      repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-1 0;1 0;0 0"
      dur="0.08s"
      repeatCount="indefinite"/>
  </text>

  <!-- Extremely subtle red separation -->
  <text
    x="602"
    y="145"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="700"
    letter-spacing="6"
    fill="#ff3158"
    opacity="0">

    BUG BOUNTY HUNTER

    <animate
      attributeName="opacity"
      values="0;0;0;0.15;0;0"
      dur="4.3s"
      repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;1 0;-1 0;0 0"
      dur="0.09s"
      repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text
    x="600"
    y="178"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    font-weight="400"
    letter-spacing="5"
    fill="#666666">
    APPLICATION SECURITY • WEB RESEARCH
  </text>

  <!-- Minimal bottom line -->
  <rect x="80" y="205" width="1040" height="1" fill="#202020"/>

  <!-- Small moving accent -->
  <rect x="80" y="205" width="90" height="1" fill="#888888">

    <animate
      attributeName="x"
      values="80;1030;80"
      dur="7s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.3;0.8;0.3"
      dur="7s"
      repeatCount="indefinite"/>

  </rect>

</svg>
