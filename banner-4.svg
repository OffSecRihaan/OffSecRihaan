```svg
<?xml version="1.0" encoding="UTF-8"?>

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="300"
    viewBox="0 0 1200 300">

    <!-- =========================================================
         BACKGROUND
         ========================================================= -->

    <rect
        width="1200"
        height="300"
        fill="#050505"/>

    <!-- Subtle frame -->
    <rect
        x="28"
        y="28"
        width="1144"
        height="244"
        rx="8"
        fill="none"
        stroke="#171717"
        stroke-width="1"/>


    <!-- =========================================================
         TOP TERMINAL LABEL
         ========================================================= -->

    <text
        x="70"
        y="72"
        font-family="monospace"
        font-size="13"
        letter-spacing="3"
        fill="#666666">
        SECURITY_RESEARCH
    </text>

    <!-- Tiny status indicator -->
    <circle
        cx="1090"
        cy="67"
        r="3"
        fill="#aaaaaa">

        <animate
            attributeName="opacity"
            values="1;0.25;1"
            dur="1.4s"
            repeatCount="indefinite"/>
    </circle>

    <text
        x="1105"
        y="72"
        font-family="monospace"
        font-size="11"
        letter-spacing="2"
        fill="#555555">
        ONLINE
    </text>


    <!-- =========================================================
         TERMINAL PROMPT
         ========================================================= -->

    <text
        x="70"
        y="142"
        font-family="monospace"
        font-size="48"
        font-weight="bold"
        letter-spacing="1"
        fill="#eeeeee">

        <tspan>&gt; </tspan>

        <!-- Typing effect -->
        <tspan>
            Bug Bounty Hunter

            <animate
                attributeName="opacity"
                values="0;0;0;1;1"
                keyTimes="0;0.15;0.3;0.45;1"
                dur="3s"
                repeatCount="indefinite"/>
        </tspan>

    </text>


    <!-- =========================================================
         CYAN GLITCH
         ========================================================= -->

    <text
        x="70"
        y="142"
        font-family="monospace"
        font-size="48"
        font-weight="bold"
        letter-spacing="1"
        fill="#00e5ff"
        opacity="0">

        &gt; Bug Bounty Hunter

        <animate
            attributeName="opacity"
            values="0;0;0.55;0;0;0.35;0"
            keyTimes="0;0.42;0.43;0.45;0.72;0.73;1"
            dur="4s"
            repeatCount="indefinite"/>

        <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0;3 0;-3 0;1 0;0 0"
            dur="0.16s"
            repeatCount="indefinite"/>

    </text>


    <!-- =========================================================
         RED GLITCH
         ========================================================= -->

    <text
        x="70"
        y="142"
        font-family="monospace"
        font-size="48"
        font-weight="bold"
        letter-spacing="1"
        fill="#ff1744"
        opacity="0">

        &gt; Bug Bounty Hunter

        <animate
            attributeName="opacity"
            values="0;0.45;0;0;0.25;0"
            keyTimes="0;0.42;0.44;0.7;0.71;1"
            dur="3.5s"
            repeatCount="indefinite"/>

        <animateTransform
            attributeName="transform"
            type="translate"
            values="0 0;-3 0;2 0;-1 0;0 0"
            dur="0.13s"
            repeatCount="indefinite"/>

    </text>


    <!-- =========================================================
         TYPING CURSOR
         ========================================================= -->

    <rect
        x="645"
        y="105"
        width="4"
        height="46"
        fill="#eeeeee">

        <animate
            attributeName="opacity"
            values="1;1;0;0;1"
            dur="0.75s"
            repeatCount="indefinite"/>

        <!-- Cursor movement -->
        <animate
            attributeName="x"
            values="105;150;195;240;285;330;375;420;465;510;555;600;645"
            dur="3s"
            repeatCount="indefinite"/>

    </rect>


    <!-- =========================================================
         SUBTITLE
         ========================================================= -->

    <text
        x="73"
        y="180"
        font-family="monospace"
        font-size="12"
        letter-spacing="4"
        fill="#555555">

        RECON  /  DISCOVER  /  REPORT

    </text>


    <!-- =========================================================
         LOWER TERMINAL LINE
         ========================================================= -->

    <text
        x="70"
        y="225"
        font-family="monospace"
        font-size="11"
        letter-spacing="2"
        fill="#3f3f3f">

        [01] ENUMERATION
    </text>

    <text
        x="290"
        y="225"
        font-family="monospace"
        font-size="11"
        letter-spacing="2"
        fill="#3f3f3f">

        [02] ANALYSIS
    </text>

    <text
        x="480"
        y="225"
        font-family="monospace"
        font-size="11"
        letter-spacing="2"
        fill="#3f3f3f">

        [03] VALIDATION
    </text>

    <text
        x="705"
        y="225"
        font-family="monospace"
        font-size="11"
        letter-spacing="2"
        fill="#3f3f3f">

        [04] REPORT
    </text>


    <!-- =========================================================
         BOTTOM PROGRESS LINE
         ========================================================= -->

    <rect
        x="70"
        y="245"
        width="1060"
        height="1"
        fill="#141414"/>

    <rect
        x="70"
        y="245"
        width="0"
        height="1"
        fill="#888888">

        <animate
            attributeName="width"
            values="0;1060;0"
            dur="6s"
            repeatCount="indefinite"/>

    </rect>


    <!-- =========================================================
         SCAN EFFECT
         ========================================================= -->

    <rect
        x="70"
        y="90"
        width="1060"
        height="1"
        fill="#ffffff"
        opacity="0">

        <animate
            attributeName="y"
            values="80;235;80"
            dur="5s"
            repeatCount="indefinite"/>

        <animate
            attributeName="opacity"
            values="0;0.05;0"
            dur="5s"
            repeatCount="indefinite"/>

    </rect>

</svg>
```
