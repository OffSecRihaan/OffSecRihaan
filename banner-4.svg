```svg
<svg width="1200" height="220" viewBox="0 0 1200 220"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1200" height="220" fill="#000000"/>

  <!-- Subtle scanlines -->
  <g opacity="0.035">
    <rect x="0" y="82" width="1200" height="1" fill="#ffffff"/>
    <rect x="0" y="92" width="1200" height="1" fill="#ffffff"/>
    <rect x="0" y="102" width="1200" height="1" fill="#ffffff"/>
    <rect x="0" y="112" width="1200" height="1" fill="#ffffff"/>
    <rect x="0" y="122" width="1200" height="1" fill="#ffffff"/>
    <rect x="0" y="132" width="1200" height="1" fill="#ffffff"/>
    <rect x="0" y="142" width="1200" height="1" fill="#ffffff"/>
  </g>

  <!-- Main text -->
  <text x="600" y="120"
        text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="42"
        font-weight="600"
        letter-spacing="1"
        fill="#e6e6e6">
    Bug Bounty Hunter
  </text>

  <!-- Cyan glitch -->
  <text x="600" y="120"
        text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="42"
        font-weight="600"
        letter-spacing="1"
        fill="#00ffff"
        opacity="0">
    Bug Bounty Hunter

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 5 0; -4 1; 2 -1; 0 0"
      dur="0.18s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0;0;0.5;0;0;0.35;0"
      dur="2.4s"
      repeatCount="indefinite"/>
  </text>

  <!-- Red glitch -->
  <text x="600" y="120"
        text-anchor="middle"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="42"
        font-weight="600"
        letter-spacing="1"
        fill="#ff003c"
        opacity="0">
    Bug Bounty Hunter

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-5 0;3 -1;-2 1;0 0"
      dur="0.16s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0;0.4;0;0;0.3;0"
      dur="2.1s"
      repeatCount="indefinite"/>
  </text>

  <!-- Typing cursor -->
  <rect x="925" y="82"
        width="3"
        height="46"
        fill="#e6e6e6">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.65s"
      repeatCount="indefinite"/>

    <!-- Move cursor as if typing -->
    <animate
      attributeName="x"
      values="600;625;650;675;700;725;750;775;800;825;850;875;900;925"
      dur="2.8s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Glitch bars -->
  <g opacity="0">
    <rect x="180" y="91" width="250" height="3" fill="#00ffff"/>
    <rect x="720" y="137" width="210" height="3" fill="#ff003c"/>

    <animate
      attributeName="opacity"
      values="0;0;0.4;0;0;0.25;0"
      dur="1.7s"
      repeatCount="indefinite"/>
  </g>

  <!-- Bottom accent -->
  <rect x="410" y="151" width="380" height="1" fill="#e6e6e6" opacity="0.12">
    <animate
      attributeName="width"
      values="0;380;380;0"
      dur="3.5s"
      repeatCount="indefinite"/>
  </rect>

</svg>
```
