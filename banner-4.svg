```svg
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="220"
     viewBox="0 0 1200 220">

  <!-- Background -->
  <rect width="1200" height="220" fill="#050505"/>

  <!-- Very subtle border -->
  <rect x="22" y="22"
        width="1156"
        height="176"
        rx="4"
        fill="none"
        stroke="#1a1a1a"
        stroke-width="1"/>

  <!-- Small terminal prompt -->
  <text x="80"
        y="72"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="13"
        letter-spacing="2"
        fill="#666666">
    SECURITY_RESEARCHER
  </text>

  <!-- Main text -->
  <text x="80"
        y="128"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="48"
        font-weight="700"
        letter-spacing="1"
        fill="#eeeeee">
    Bug Bounty Hunter
  </text>

  <!-- Cyan RGB glitch -->
  <text x="80"
        y="128"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="48"
        font-weight="700"
        letter-spacing="1"
        fill="#00e5ff"
        opacity="0">

    Bug Bounty Hunter

    <animate
      attributeName="opacity"
      values="0;0;0.45;0;0;0.25;0"
      dur="3.2s"
      repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;2 0;-2 0;1 0;0 0"
      dur="0.12s"
      repeatCount="indefinite"/>
  </text>

  <!-- Red RGB glitch -->
  <text x="80"
        y="128"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="48"
        font-weight="700"
        letter-spacing="1"
        fill="#ff1744"
        opacity="0">

    Bug Bounty Hunter

    <animate
      attributeName="opacity"
      values="0;0.35;0;0;0.2;0"
      dur="2.7s"
      repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;-2 0;2 0;-1 0;0 0"
      dur="0.14s"
      repeatCount="indefinite"/>
  </text>

  <!-- Cursor -->
  <rect x="548"
        y="91"
        width="3"
        height="45"
        fill="#eeeeee">

    <animate
      attributeName="opacity"
      values="1;0;1;0;1"
      dur="0.9s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="82"
        y="158"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="12"
        letter-spacing="3"
        fill="#555555">
    RECON  •  DISCOVER  •  REPORT
  </text>

  <!-- Right-side status -->
  <text x="1120"
        y="72"
        text-anchor="end"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="11"
        letter-spacing="2"
        fill="#555555">
    STATUS
  </text>

  <circle cx="1080"
          cy="92"
          r="3"
          fill="#eeeeee">
    <animate
      attributeName="opacity"
      values="1;0.25;1"
      dur="1.4s"
      repeatCount="indefinite"/>
  </circle>

  <text x="1095"
        y="96"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="11"
        fill="#777777">
    ACTIVE
  </text>

  <!-- Bottom accent -->
  <rect x="80"
        y="181"
        width="1040"
        height="1"
        fill="#151515"/>

  <rect x="80"
        y="181"
        width="110"
        height="1"
        fill="#888888">

    <animate
      attributeName="x"
      values="80;1010;80"
      dur="5s"
      repeatCount="indefinite"/>
  </rect>

</svg>
```
